name: Student Result ML CI-CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML and API dependencies
        run: pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML and API tests
        run: python -m unittest discover -v

      - name: Build Docker image
        run: docker build -t student-result-ml:${{ github.sha }} .

      - name: Start Docker test container
        run: docker run -d --name student-result-ml-container -p 8000:8000 student-result-ml:${{ github.sha }}

      - name: Wait for API health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Application health check passed."
              exit 0
            fi
            echo "Waiting for API (attempt $attempt)..."
            sleep 2
          done
          echo "Health check failed."
          docker logs student-result-ml-container
          exit 1

      - name: Test Prometheus metrics endpoint in container
        run: |
          response=$(curl --fail --silent --show-error http://localhost:8000/metrics)
          echo "$response" | grep -q 'student_api_model_loaded'
          echo "$response" | grep -q 'student_api_http_requests_total'
          echo "$response" | grep -q 'student_api_http_request_duration_seconds'
          echo "Prometheus metrics endpoint passed."

      - name: Test prediction endpoint in container
        run: |
          response=$(curl --fail --silent --show-error -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}')
          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction":"PASS"'

      - name: Show Docker container logs
        if: always()
        run: docker logs student-result-ml-container || true

      - name: Stop and remove Docker test container
        if: always()
        run: docker rm -f student-result-ml-container || true

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py api.py student_result_model.pkl metrics.json requirements.txt Dockerfile .dockerignore release_candidate/
          printf "Student Result Prediction ML Application\\nRun container image on port 8000.\\nHealth: GET /health\\nDocs: GET /docs\\nPrediction: POST /predict\\nMetrics: GET /metrics\\n" > release_candidate/DEPLOYMENT.txt
          cp -R Practical_12_Monitoring PRACTICAL_11_12_IMPLEMENTATION.md release_candidate/

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: student-result-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v7
        with:
          name: student-result-ml-artifacts
          path: |
            student_result_model.pkl
            metrics.json
            student_results.csv
          if-no-files-found: error
          retention-days: 7
